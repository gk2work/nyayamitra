# ═══════════════════════════════════════════════════════════════════════════════
# NYAYAMITRA — Docker Compose (Local Development)
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   cp .env.example .env        # First time only
#   docker compose up -d        # Start all services
#   docker compose ps           # Check status
#   docker compose logs -f      # Follow logs
#   docker compose down         # Stop all services
#   docker compose down -v      # Stop + wipe all data
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL (Primary Database) ───────────────────────────────────────
  # Stores: users, sessions, query logs, feedback, act/judgment metadata
  postgres:
    image: postgres:16-alpine
    container_name: nyayamitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyayamitra}
      POSTGRES_USER: ${POSTGRES_USER:-nyayamitra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nyayamitra} -d ${POSTGRES_DB:-nyayamitra}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis (Cache + Session Store) ──────────────────────────────────────
  # Stores: session data, response cache, rate limiting counters
  redis:
    image: redis:7-alpine
    container_name: nyayamitra-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Qdrant (Vector Database) ───────────────────────────────────────────
  # Stores: embeddings for acts, sections, judgments, procedures
  # Collections: acts_sections, sc_judgments, hc_judgments, procedures
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: nyayamitra-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Elasticsearch (BM25 Sparse Retrieval) ──────────────────────────────
  # Stores: full-text indices for exact keyword/section number matching
  # Indices mirror Qdrant collections for hybrid search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: nyayamitra-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.name=nyayamitra-es
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Neo4j (Legal Knowledge Graph) ──────────────────────────────────────
  # Stores: Act, Section, Judgment, Court, LegalPrinciple nodes
  # Relationships: INTERPRETS, OVERRULES, DISTINGUISHES, BELONGS_TO, ESTABLISHES
  neo4j:
    image: neo4j:5.18-community
    container_name: nyayamitra-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-this-password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-change-this-password} 'RETURN 1' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

# ─── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  es_data:
    driver: local
  neo4j_data:
    driver: local
